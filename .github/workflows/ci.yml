name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# 같은 ref 에 새 push 가 오면 진행 중인 런을 취소한다.
# 근거: ~/.claude/ci-policy.md 6항 (사용량과 무관하게 적용).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    # 2026-11-08 ubuntu-latest=26.04 에 Ruby 미제공 → 고정.
    # 내일앨범·hellokorean-rails 가 같은 원인으로 CI 가 깨졌다.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    # 2026-11-08 ubuntu-latest=26.04 에 Ruby 미제공 → 고정.
    # 내일앨범·hellokorean-rails 가 같은 원인으로 CI 가 깨졌다.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    # 2026-11-08 ubuntu-latest=26.04 에 Ruby 미제공 → 고정.
    # 내일앨범·hellokorean-rails 가 같은 원인으로 CI 가 깨졌다.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    # 2026-11-08 ubuntu-latest=26.04 에 Ruby 미제공 → 고정.
    # 내일앨범·hellokorean-rails 가 같은 원인으로 CI 가 깨졌다.
    runs-on: ubuntu-24.04
    # 최근 성공한 test 잡 10건의 중앙값 61초(측정 2026-11-07, 최소 49s / 최대 87s)의
    # 약 2배는 2분이지만, 정책의 하한 15분을 적용한다. 번들러 캐시 미스나
    # apt-get 지연이 겹치면 2분은 정상 런도 끊는다.
    timeout-minutes: 15

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: redis
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config google-chrome-stable

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
