# Two shapes matter for indexing, and they are the two fixtures here:
#
#   korean_only  — the shape every one of the 42 live posts actually has
#                  (body_ko filled, body_en blank). Its /en, /ja and /es URLs
#                  serve the Korean article under a translated shell, so they
#                  carry noindex and canonicalise back to the Korean URL.
#   bilingual    — body_en filled as well. Exists on no live post yet, but it is
#                  the shape the translation gate is written for, so the tests
#                  need it to prove the gate opens and not just that it is shut.

korean_only:
  title_ko: "한국어 전용 글"
  body_ko: "<p>한국어 본문입니다.</p>"
  body_en: ""
  slug: "korean-only-post"
  category: "pdf"
  status: "published"
  published_at: <%= 3.days.ago.to_fs(:db) %>
  meta_description_ko: "한국어 전용 글의 설명"

bilingual:
  title_ko: "번역된 글"
  title_en: "Translated post"
  body_ko: "<p>한국어 본문입니다.</p>"
  body_en: "<p>English body.</p>"
  slug: "bilingual-post"
  category: "global"
  status: "published"
  published_at: <%= 2.days.ago.to_fs(:db) %>
  meta_description_ko: "번역된 글의 설명"
  meta_description_en: "Description of the translated post"

# PostsController#show serves draft and scheduled posts too, so the preview link
# works before publication. That 200 is deliberate; being indexable was not.
# Both have a Korean body, which is precisely the case the old gate waved
# through — translated?(:ko) was true, so no noindex was emitted.

draft_post:
  title_ko: "초안 글"
  body_ko: "<p>아직 발행하지 않은 초안입니다.</p>"
  body_en: ""
  slug: "draft-post"
  category: "office"
  status: "draft"
  meta_description_ko: "초안 글의 설명"

scheduled_post:
  title_ko: "예약된 글"
  body_ko: "<p>발행 예약된 글입니다.</p>"
  body_en: ""
  slug: "scheduled-post"
  category: "student"
  status: "scheduled"
  published_at: <%= 3.days.from_now.to_fs(:db) %>
  meta_description_ko: "예약된 글의 설명"

# A published post translated into English, used to prove the locale split holds
# once body_en is actually filled in: the unprefixed URL must stay Korean no
# matter what the reader's browser asks for, and only /en may serve English.
bilingual_published:
  title_ko: "이중언어 발행 글"
  title_en: "Bilingual published post"
  body_ko: "<p>한국어 본문 고유문자열 KOBODY.</p>"
  body_en: "<p>English body unique marker ENBODY.</p>"
  slug: "bilingual-published-post"
  category: "global"
  status: "published"
  published_at: <%= 1.day.ago.to_fs(:db) %>
  meta_description_ko: "한국어 설명 KODESC"
  meta_description_en: "English description ENDESC"

# ── Added 2026-10-25 (S8b, cross-review Q1) ────────────────────────────────
#
# Two shapes the E-1 snapshot did not cover, both of which exercise branches
# the Japanese track touched.

# body_en WITHOUT body_ko, unpublished. The published-post invariant does not
# apply to drafts, so this row is legal — and it is the shape that would break
# if `translated?`/`indexable_locales` ever stopped folding in publication
# state: English text exists, so a body-only rule would call /en indexable on a
# post nobody has published.
english_only_draft:
  title_ko: "영문만 있는 초안"
  title_en: "English-only draft"
  body_ko: ""
  body_en: "<p>English body on an unpublished post.</p>"
  slug: "english-only-draft"
  category: "global"
  status: "draft"
  meta_description_en: "Draft with an English body and no Korean one"

# NOT fixtured: a post at the redirect TARGET (resident-number-masking /
# contract-sharing-checklist).
#
# Those two slugs are owned by `blog:migrate_privacy`, and
# test/integration/privacy_guide_ownership_test.rb asserts the database holds
# none of them before that task runs. A fixture sitting on one would break that
# assertion — measured: 8 failures, all the same precondition — and that
# ownership guard is worth more than a second assertion here.
#
# The signal that can actually regress is the 301 itself (Search Console had
# already indexed the old URLs), and the snapshot pins all eight of those —
# both slugs x four locale prefixes — without needing a row at the target.
