  faq:
    title: "FAQ - SlimFile"
    heading: "자주 묻는 질문"
    items:
      - q: "SlimFile은 무료인가요?"
        a: "네, 완전 무료입니다. 회원가입 없이 바로 사용할 수 있어요."
      - q: "이미지 압축 후 화질이 떨어지나요?"
        a: "최대한 화질을 유지하면서 2MB 이하로 압축합니다. 육안으로 거의 차이가 없어요."
      - q: "한 번에 몇 개 파일을 올릴 수 있나요?"
        a: "최대 20개 파일을 한 번에 올릴 수 있습니다. 파일당 최대 10MB까지 지원합니다."
      - q: "업로드한 파일은 서버에 저장되나요?"
        a: "처리 후 자동으로 삭제됩니다. 개인정보 걱정 없이 사용하세요."
      - q: "어떤 파일 형식을 지원하나요?"
        a: "JPG, PNG, HEIC, WebP 등 주요 이미지 형식을 모두 지원합니다."
      - q: "SNS 리사이즈는 어떤 규격을 지원하나요?"
        a: "인스타그램 1:1 (1080x1080), 4:5 (1080x1350) / 페이스북 1.91:1 (1200x630), 9:16 (1080x1920) 규격을 지원합니다."

  # ── Validation messages ─────────────────────────────────────────────────
  #
  # There was no activerecord block here at all, and ko is the default locale,
  # so every validation failure rendered as its own lookup trace:
  #
  #   ActiveRecord::RecordInvalid#message
  #     → "Translation missing: ko.activerecord.errors.messages.record_invalid"
  #   errors.full_messages
  #     → "Body ko Translation missing. Options considered were: …"
  #
  # Two places read those strings where a person is meant to understand them:
  # the admin post/banner forms, and — since 2026-09-18 — the failure report
  # PublishScheduledPostsJob mails when a post cannot be published. An alert
  # whose reason field says "Translation missing" is an alert that does not
  # work, so this block is part of that fix rather than a cosmetic aside.
  #
  # Scoped to the three validators this app actually uses (presence, uniqueness,
  # inclusion) plus the record_invalid wrapper. There is no rails-i18n gem here;
  # if one is ever added it supersedes this block.
  # ── SafeFile JP 주간 승인 화면·메일 (S9) ────────────────────────────────────
  #
  # 승인자는 한국어로 읽는다. 패키지는 일본어다.
  #
  # S8 에서 이 화면과 메일은 전부 일본어였다 — 콘텐츠가 일본어라서 UI 도 일본어로
  # 쓴 것이고, 그 결과 「승인」 버튼이 2,000자 일본어 법률 산문에 책임지라고 요구했다.
  # 그 자리에서 사람이 하는 정직한 행동은 그냥 승인하는 것이다.
  #
  # 그래서 **UI 문자열은 전부 한국어, 콘텐츠 본문(JA/EN)만 원문**이다. 뷰에는
  # 하드코딩된 문자열을 두지 않는다(`t()` 만) — 그렇게 해야 「어떤 문장이 승인자에게
  # 보이는가」를 이 파일 하나에서 전수로 읽을 수 있고, 다음에 화면을 고치는 사람이
  # 일본어 한 줄을 조용히 되살릴 수 없다.
  #
  # 톤은 기존 KO 어드민(/admin/posts)과 맞춘다: 「발행되지 못한 글 N건 — 이유」처럼
  # 무엇이 일어났는지와 왜인지를 한 줄에 붙여 쓴다.
