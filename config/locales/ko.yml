  errors:
    # No space between attribute and message: Korean particles attach to the
    # noun ("본문(한국어)을(를) …", "카테고리에 …"), so the default
    # "%{attribute} %{message}" would put a gap in the middle of a word.
    format: "%{attribute}%{message}"
    messages:
      blank: "을(를) 입력해 주세요"
      taken: "은(는) 이미 사용 중입니다"
      inclusion: "에 허용되지 않는 값이 들어왔습니다"
  activerecord:
    errors:
      messages:
        record_invalid: "저장할 수 없습니다: %{errors}"
        blank: "을(를) 입력해 주세요"
        taken: "은(는) 이미 사용 중입니다"
        inclusion: "에 허용되지 않는 값이 들어왔습니다"
        # Added 2026-10-22 with jp_pilot_requests. Format and length validators
        # had no ko message, so a rejected sign-up reported
        # "EmailTranslation missing. Options considered were: …" — measured, not
        # hypothetical. The applicant never sees these strings (the JP form
        # renders its own Japanese text from the returned field names), but the
        # server log and rails console do, and a log line that reports its own
        # lookup trace instead of the reason is a log line that does not work.
        invalid: "의 형식이 올바르지 않습니다"
        too_long: "이(가) 너무 깁니다 (최대 %{count}자)"
        too_short: "이(가) 너무 짧습니다 (최소 %{count}자)"
        not_a_number: "은(는) 숫자여야 합니다"
    models:
      post: "블로그 글"
      banner: "배너"
      jp_pilot_request: "SafeFile JP 파일럿 신청"
    attributes:
      post:
        title_ko: "제목(한국어)"
        title_en: "제목(영어)"
        # Added 2026-10-25 with the JP track. Without these a rejected Japanese
        # package reported "Title ja을(를) 입력해 주세요" — half English humanize,
        # half Korean particle. The admin form and the publish-failure email
        # both render these strings.
        title_ja: "제목(일본어)"
        body_ko: "본문(한국어)"
        body_en: "본문(영어)"
        body_ja: "본문(일본어)"
        subtitle_ja: "부제(일본어)"
        meta_description_ja: "메타 설명(일본어)"
        primary_locale: "정본 언어"
        content_track: "콘텐츠 트랙"
        content_ep: "회차"
        meta_description_ko: "메타 설명(한국어)"
        meta_description_en: "메타 설명(영어)"
        slug: "슬러그"
        category: "카테고리"
        status: "상태"
        published_at: "발행일시"
      banner:
        title_en: "제목(영어)"
        title_ko: "제목(한국어)"
        position: "위치"
        page: "페이지"
        banner_type: "배너 종류"
      jp_pilot_request:
        company: "회사명"
        industry: "업종"
        monthly_count: "월간 제출 건수"
        authority: "자주 쓰는 발주처"
