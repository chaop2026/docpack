production:
  publish_scheduled_posts:
    class: PublishScheduledPostsJob
    schedule: every day at 9am Asia/Seoul
  auto_generate_blog_post:
    class: AutoGenerateBlogPostJob
    schedule: every Monday, Wednesday, and Friday at 0am Asia/Seoul
  # SafeFile JP weekly package (2026-10-25). Saturday 00:00 KST, so the review
  # email is waiting when Justin opens his mail over the weekend and the blog
  # post is still two days out from its Monday 09:00 JST slot. One episode per
  # run; the job sends at most one review mail per episode per week.
  #
  # The KO schedule above is deliberately unchanged — the two tracks share the
  # posts table but are separate publications, and BlogTopic.next_ko keeps the
  # Korean generator from ever picking up a Japanese episode.
  auto_generate_jp:
    class: AutoGenerateJpPostJob
    schedule: every Saturday at 0am Asia/Seoul
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
