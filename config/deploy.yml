service: docpack

image: chaop2026/docpack

servers:
  web:
    - 5.223.92.4

proxy:
  ssl: true
  host: slimfile.net
  app_port: 3000

registry:
  server: ghcr.io
  username: chaop2026
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - DB_PASSWORD
    - ANTHROPIC_API_KEY
    - GMAIL_USERNAME
    - GMAIL_PASSWORD
    - ADMIN_PASSWORD
    # IndexNow ownership key (S11). Public by protocol — it is served back at
    # /<key>.txt — but listed under `secret` because that is how a value gets
    # out of .env.production.local and into the container WITHOUT being
    # committed to this public repository. Until it is set, IndexNow.dry_run?
    # is true and every submission is a log line (lib/index_now.rb).
    #
    # Generate one (any 8–128 char hex string) and put it in
    # .env.production.local as INDEXNOW_KEY=…; .kamal/secrets reads that file.
    - INDEXNOW_KEY
  clear:
    RAILS_ENV: production
    RAILS_LOG_LEVEL: info
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: docpack-db
    DB_PORT: 5432
    DB_USERNAME: docpack
    RAILS_SERVE_STATIC_FILES: true
    WEB_CONCURRENCY: 2
    # X posting stays OFF in production, and it is declared HERE rather than in
    # .env.production.local on purpose.
    #
    # Kamal builds the container env from this file: a `clear` value is written
    # into the env Kamal hands the container, so it is what the process sees
    # regardless of what any dotenv on the host says. Before this line the
    # variable reached the container from nowhere at all — `XClient.dry_run?`
    # was true only because the four X credentials were absent, so the moment
    # somebody added the credentials the very next deploy would have started
    # posting to a public account with nothing having been decided.
    #
    # Turning real posting on therefore has to be a DELIBERATE COMMIT that
    # deletes this line, reviewable in the diff, rather than a dotenv edit on
    # the server that leaves no trace. Do not delete it until the plan tier,
    # the monthly write cap and media-upload permission have been confirmed on
    # the real account (see lib/x_client.rb).
    X_API_DRY_RUN: "1"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

volumes:
  - "docpack_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: postgres:16
    host: 5.223.92.4
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: docpack
        POSTGRES_DB: docpack_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - docpack_pgdata:/var/lib/postgresql/data
