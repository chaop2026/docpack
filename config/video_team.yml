# 영상팀 설정 — docpack(SafeFile JP)
#
# `~/.claude/agents/video-{story,production,thumbnail,qa}.md` 네 에이전트는
# **서비스 중립**이다. 서비스에 딱 붙는 값은 전부 이 파일에서 읽는다. 그래서
# 같은 네 에이전트를 다른 저장소에서 쓰려면 그 저장소에 이 파일 하나를 두면 된다.
#
# 🔴 **이 파일이 없으면 에이전트는 추측하지 않고 멈춘다.** 추측한 채널에 올리거나
#    추측한 가드로 검사하면, 결과가 「통과」로 보이는데 아무것도 검사되지 않는다.
#
# 🔴 **누가 이 파일을 읽는가 — 2026-11-16 정정.**
#    처음 이 자리에 「Claude Code 세션과 `scripts/content/*.mjs` 가 읽는다」고 적었는데
#    **거짓이었다.** 생성기들은 YAML 을 로드하지 않고 채널 값을 코드에 박고 있다
#    (교차검증이 잡았다). 실제 계약은 이렇다:
#
#    | 누가 | 어떻게 |
#    |---|---|
#    | `~/.claude/agents/video-*.md` 네 에이전트 | **읽는다**. 없으면 멈춘다 |
#    | `scripts/content/*.mjs` 생성기 | **읽지 않는다.** 값을 코드에 박는다 |
#    | `scripts/content/qa_video.mjs` | **대조한다** — 박힌 값과 이 파일이 어긋나면 실패 |
#    | Rails | 읽지 않는다 (`git grep video_team.yml -- app config/initializers` → 0건) |
#
#    즉 이 파일은 **선언**이고, 코드가 그 선언을 지키는지는 QA 가 검사한다.
#    생성기에 YAML 로더를 넣지 않은 이유는 의존성이 아니라 고장 모드다 — 로더가 조용히
#    기본값으로 떨어지면 **틀린 채널 값으로 링크가 만들어지고, 서버가 이벤트 전체를
#    버리는데 sendBeacon 은 응답을 안 읽어 양쪽에서 안 보인다.** 박아두고 대조하는 쪽이
#    실패를 빌드 시점으로 끌어온다.
#
# ⚠️ **런타임 설정이 아니다.** `config/` 에 둔 이유는 사람이 설정을 찾는 자리이기
#    때문이고, 앱 부팅에는 아무 영향이 없다.

service: SafeFile JP
repo: docpack

# 콘텐츠 언어와 승인자 언어가 다르다 — 이 프로젝트의 핵심 제약이다.
# 산출물은 일본어이고, 승인 버튼을 누르는 사람은 한국어로 읽는다.
# 승인 화면이 일본어이면 승인은 형식이 된다(S9 에서 이미 한 번 고쳤다).
lang: ja
approver_lang: ko

# ── 채널 ──────────────────────────────────────────────────────────────────── #
#
# 채널의 생성·소유·관리자·전화 인증·공개 연락처는 **허브('SNS 계정 운영' 프로젝트)**
# 몫이다. 이 저장소의 세션은 그 작업을 하지 않고, 필요하면 보고에
# 「허브에 요청: …」으로 남긴다.
channel:
  handle: "@safefile_jp"
  # Studio 왼쪽 위에 이 이름이 보이는지 업로드 전에 확인한다. 개인 기본 채널
  # ("Sunghoon Sim")에 올리면 되돌릴 수 없다(공개 URL 이 이미 나간다).
  display_name: "SafeFile セーフファイル"
  # 쇼츠 설명란·댓글의 링크는 **클릭되지 않는다**(2026-11-01 확정 사실).
  # 클릭되는 곳만 적는다 — 적어두지 않으면 다음 사람이 설명란에 링크를 넣고
  # 「전환이 0이다」로 읽는다.
  clickable_link_surfaces:
    - channel_profile_link   # 1번 = 랜딩. 쇼츠 끝 화면이 여기를 가리킨다
    - longform_description   # 긴 영상 설명란 — 눌린다
    - longform_comment       # 긴 영상 댓글 — 눌린다
  unclickable_link_surfaces:
    - shorts_description
    - shorts_comment
  # 고급 기능(전화 인증) 활성화 후에만 가능. 허브 요청 대상.
  requires_advanced_features:
    - shorts_related_video   # 쇼츠 → 우리 긴 영상 링크
  # 쇼츠 피드에는 썸네일이 보이지 않는다 → 첫 2초가 썸네일 역할을 한다. 이 부분은 확실하다.
  #
  # ⚠️ **맞춤 썸네일 업로드 가능 여부는 미확인이다.** 2026-11-16 지시서는 「YPP 채널부터
  #    열렸다」였고 그대로 따랐는데, 같은 날 교차검증이 **「현재 공식 안내는 인증된 계정이
  #    데스크톱 Studio 에서 쇼츠 맞춤 썸네일을 올릴 수 있다고 설명한다」**고 반박했다.
  #    어느 쪽도 이 저장소에서 측정한 것이 아니다.
  #
  #    🔴 **확인 방법은 1분이다**: Studio 에서 쇼츠 하나를 열어 「썸네일」에
  #    **업로드 버튼이 있는지** 본다. 규칙을 추론하지 말고 우리 채널에서 본다.
  #    - 있다면 → 이 값을 true 로 바꾸고 `thumb_short_{a,b}.png` 를 **직접 올린다**
  #      (끝 화면은 그래도 남긴다 — 그건 썸네일이 아니라 CTA 다)
  #    - 없다면 → 지금 그대로. 프레임 선택으로 끝 화면을 집는다
  shorts_custom_thumbnail: false
  shorts_custom_thumbnail_verified: false   # 우리 채널에서 눈으로 본 적 없음

# ── 계측 ──────────────────────────────────────────────────────────────────── #
#
# `?utm_*` 는 쓰지 않는다 — 차단 확장이 브라우저 단계에서 지운다(2026-10-27 실측).
# 값은 `app/models/safe_event.rb` 의 `VALUES["via"]` 가 정본이고, 이 줄은 그 중
# **영상 채널 둘**을 가리키는 포인터다. 추가하려면 그 상수와 `public/safe/jp/jp.js`
# 의 `VIA_CHANNELS` 를 함께 바꿔야 하고, 집합 동등을 단언하는 테스트가 있다.
attribution:
  param: via
  episode_param: ep
  shorts_channel: youtube
  longform_channel: yt_long

# ── 가드 ──────────────────────────────────────────────────────────────────── #
#
# 금지어·필수문·법적 주장 규칙의 **정본 하나**. JS 파이프라인
# (`scripts/content/guard_rules.mjs`)과 서버(`app/services/jp_content_guard.rb`)가
# 같은 파일을 읽는다 — 한쪽에만 있는 규칙은 다른 쪽이 조용히 어길 수 있는 규칙이다.
guard:
  rules: content/jp/guard_rules.json
  js_loader: scripts/content/guard_rules.mjs
  ruby: app/services/jp_content_guard.rb

# ── 계획 정본 ─────────────────────────────────────────────────────────────── #
#
# 33회차. `ep` = 발행 순서 = `week` = 폴더 번호.
# **에이전트는 이 파일을 직접 고치지 않는다** — 순서 조정은 제안만 하고 사람이 적용한다.
plan:
  topics: content/jp/topics.json
  episode_dir: content/jp/ep%<epp>s      # epp = 2자리(ep01)
  intents: [理由, 手順, 比較]

# ── 산출물 경로 ───────────────────────────────────────────────────────────── #
assets:
  thumbnail_templates: scripts/content/templates/thumbnail
  thumbnail_version: v1                 # 틀 버전. 바꾸면 trend 메모에 사유를 남긴다
  shorts: scripts/content/make_short.mjs
  thumbnail: scripts/content/make_thumbnail.mjs
  longform: scripts/content/make_longform.mjs
  episode: scripts/content/make_episode.mjs
  channel_dir: content/jp/channel
  trend_notes: docs/jp/thumbnail_trends       # YYYY-MM.md, 월 1회

# ── 승인 ──────────────────────────────────────────────────────────────────── #
#
# 2회만 받는다. 왜 4회가 아닌지는 docs/jp/video_approval_flow.md 에 적었다.
approval:
  gates: 2
  gate1:
    when: 주초
    what: [주제, hook 1안(3안 중), 썸네일 1안(2안 중)]
    artifact: content/jp/ep%<epp>s/plan_ko.md
    lang: ko
  gate2:
    when: 토요일
    where: /admin/jp/packages      # 기존 화면. 이번 세션은 바꾸지 않았다
    lang: ko

# ── 금지 ──────────────────────────────────────────────────────────────────── #
#
# 에이전트가 **하지 않는** 일. 사람이 하거나 허브가 한다.
forbidden:
  - YouTube 업로드(공개·비공개·예약 전부)
  - kamal 배포
  - 프로덕션 DB 작업
  - 채널 생성·소유자 변경·전화 인증
  - 이메일 주소·계정 식별자를 커밋에 넣기   # 이 저장소는 PUBLIC 이다
  - topics.json 직접 수정(제안만)
